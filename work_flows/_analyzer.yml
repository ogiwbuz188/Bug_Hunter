name: Run C C++ Static Analyzer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Grants permission to push code changes back to the repo
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetches full history so git push works properly
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run static analyzer
        run: |
          # Replace 'my_analyzer.py' and '--input src/' with your actual script details
          python my_analyzer.py --input src/ --format markdown --output report.md
          python my_analyzer.py --input src/ --format html --output html.md

      - name: Commit and Push Reports
        run: |
          # Set up git user identity using GitHub Actions bot account
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the two report files
          git add report.md html.md
          
          # Only commit and push if the reports actually changed
          if git diff --staged --quiet; then
            echo "No changes in reports to commit."
          else
            git commit -m "chore: update static analysis reports [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
