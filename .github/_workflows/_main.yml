name: Run C C++ Static Analyzer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run static analyzer
        run: |
          # 1. Create the target folders with leading underscores
          mkdir -p _report.md
          mkdir -p _html.md

          # 2. Run the analyzer and output the files directly into those folders
          python my_analyzer.py --input src/ --format markdown --output _report.md/report.md
          python my_analyzer.py --input src/ --format html --output _html.md/html.md

      - name: Upload report.md as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-analysis-report
          path: _report.md/report.md

      - name: Upload html.md as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-analysis-report
          path: _html.md/html.md

      - name: Commit and Push to Main Branch Folders
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage both underscore folders containing the reports
          git add _report.md/ _html.md/
          
          if git diff --staged --quiet; then
            echo "No changes in reports to commit."
          else
            git commit -m "chore: update static analysis report folders [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
